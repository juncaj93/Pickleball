<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f2f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme.js"></script>
    <!-- Start the main font right away so text does not shift when it arrives. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2" />
    <!-- Opens full screen when launched from the Home Screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pickle Bros" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- Icons come from the club logo: node scripts/make-icons.cjs path/to/logo.png -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pickleball Bros</title>
    <meta name="description" content="Pickleball Bros: Tuesday and Thursday sign-ups." />
    <meta property="og:title" content="Pickleball Bros" />
    <meta property="og:description" content="Tuesday and Thursday pickleball sign-ups." />
    <meta property="og:site_name" content="Pickleball Bros" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pickleball.juncaj.net/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
