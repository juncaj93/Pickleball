# A tiny scheduled Worker: every morning it asks the site to send the
# "Finalize last night's game" Telegram nudge. The site decides whether
# anything is due (9:00 AM Eastern or later, a game ended before today that
# is still not finalized, nudged at most once). Free plan: a cron trigger
# costs nothing. Both times are UTC; one of them is 9:00 AM Eastern depending
# on daylight saving, and the site ignores the other because it is 8 AM
# (too early) or 10 AM (already nudged at 9).
#
#   cd cron && npx wrangler deploy
#   npx wrangler secret put CRON_SECRET      (the same value as the Pages secret)
name = "pickleball-cron"
main = "worker.js"
compatibility_date = "2025-10-01"

[triggers]
crons = ["0 13 * * *", "0 14 * * *"]

[vars]
SITE_URL = "https://pickleball.juncaj.net"
