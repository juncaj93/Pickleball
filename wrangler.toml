# Cloudflare Pages project config. `database_id` comes from
# `npx wrangler d1 create pickleball` (see README).
name = "pickleball-club"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "pickleball"
database_id = "5c939453-ebef-4a1d-869e-9a952339d275"
migrations_dir = "migrations"

# The address players use. Shown as the player link in Settings and used in texts.
[vars]
SITE_URL = "https://pickleball.juncaj.net"
# "on": night-before Telegram alerts link to the direct text page /go/... (turn "off" to fall back to the admin link).
GO_LINKS = "on"
# "Time may shift" (tilde times, court borders, the Still in notice, Confirmed x of y). "off" hides them all.
TIME_SHIFT = "on"
# "Motion" (animations on the player screens). "on" = everyone (switched on Sun Nov 1, 2026, 8:2x PM Eastern).
# "off" = dark for everyone; a phone opened once with ?motion=on still sees it (the private test switch). Needs a deploy.
MOTION = "on"
# "Motion" on the organizer screens (a separate switch, because MOTION above is already on for the players).
# "on" = the organizer screens animate (switched on Sun Nov 1, 2026, about 10:10 PM Eastern, after Alex tested it on his phone).
# "off" = dark. A phone opened once with ?motionadmin=on still sees it (the private test switch). Needs a deploy.
MOTION_ADMIN = "on"
# "Ask for payment on every game" (Pay shows on Not booked and Waitlist games too). "on" here only ALLOWS it; who
# sees it is Settings > Money > "Ask for payment on every game" (off at ship = nobody), plus a phone opened once
# with ?payalways=on (the private test switch). "off" = the kill switch: nobody, not even the test link. Needs a deploy.
PAY_ALWAYS = "on"
# "New admin layout" (organizer History, Money and Home, version 2). "on" here only ALLOWS it; who sees it is
# Settings > Feature switches > "New admin layout" (off at ship = nobody), plus a phone opened once with
# /admin?adminv2=on (the private test switch). "off" = the kill switch: nobody, not even the test link. Needs a deploy.
ADMIN_V2 = "on"
# "No Venmo? Pay Alex directly" (a small note on the player screen when Pay did not open the Venmo app). "on" here only
# ALLOWS it; who sees it is Settings > Feature switches > "No Venmo? note" (off at ship = nobody), plus a phone opened
# once with ?paynote=on (the private test switch). "off" = the kill switch: nobody, not even the test link. Needs a deploy.
PAY_NOTE = "on"
# "Admin screens, round 2" (organizer Home cards, Money, Players with Hide player, History highlight, header). "on" here only
# ALLOWS it; who sees it is Settings > Feature switches > "Admin screens, round 2" (off at ship = nobody), plus a phone
# opened once with /admin?adminr2=on (the private test switch). "off" = the kill switch: nobody, not even the test link.
# Needs a deploy.
ADMIN_R2 = "on"
# "Admin screens, round 3" (organizer Edit game and Add game forms, the Settings clean-up, the Players page layout). "on" here
# only ALLOWS it; who sees it is Settings > Feature switches > "Admin screens, round 3" (off at ship = nobody), plus a phone
# opened once with /admin?adminr3=on (the private test switch). It also needs round 2 on. "off" = the kill switch: nobody,
# not even the test link. Display only. Needs a deploy.
ADMIN_R3 = "on"
# "Late drops owe $14" (CHANGES MONEY: a late drop that leaves a game below 4 owes unless someone takes the spot; a no-show
# with fewer than 4 played owes; a late cancel asks "Did the venue waive the fee?"). "on" here only ALLOWS it; who gets it
# is Settings > Feature switches > "Late drops owe $14" (off at ship = nobody), plus a phone opened once with ?latefees=on
# (the private test switch). "off" = the kill switch: nobody makes new debts, not even the test link. Needs a deploy.
LATE_FEES = "on"
# "Player screen small fixes, round 1" (Pay and "I paid" on tonight's game card as well as on the "Tonight: you owe" card at
# the top, and a roomier blue TONIGHT tag). "on" here only ALLOWS it; who sees it is Settings > Feature switches
# > "Player screen fixes" (off at ship = nobody), plus a phone opened once with ?playerfix1=on (the private test switch).
# "off" = the kill switch: nobody, not even the test link. Display only: no money rule changes. Needs a deploy.
PLAYER_FIX1 = "on"
# "Pay sheet" (Pay opens a small bottom sheet: Pay with the Venmo app, Copy Venmo @handle, Apple Pay / Zelle / cash line,
# I paid; it replaces the "No Venmo? note" while on). "on" here only ALLOWS it; who sees it is Settings > Feature
# switches > "Pay sheet" (off at ship = nobody), plus a phone opened once with ?paysheet=on (the private test switch).
# "off" = the kill switch: nobody, not even the test link. Display only: no money rule changes. Needs a deploy.
PAY_SHEET = "on"
# "Texts and alerts, round 2" (new wording for every prefilled text, new wording and timing for the Telegram alerts, the cancel sheet
# answering No to "Did the venue waive the fee?" by default). "on" here only ALLOWS it; who gets it is Settings > Feature switches >
# "Texts and alerts, round 2" (off at ship = nobody), plus a phone opened once with /admin?textsr2=on (the private test switch: it
# changes the texts that phone opens and its cancel sheet; the Telegram alerts and the 5-minute clock change only when it is on for
# everyone). "off" = the kill switch: nobody, not even the test link, and the clock sends the old alerts. No money rule, amount or game
# rule depends on it. Needs a deploy.
TEXTS_R2 = "on"
# "Late-cancel fee split" (CHANGES MONEY: a cancel inside 12 hours where the venue kept the fee, with 5 or more in, prices every seat
# like a played game instead of a flat $14; needs LATE_FEES on). "on" here only ALLOWS it; who gets it is Settings > Feature switches >
# "Late-cancel fee split" (off at ship = nobody), plus a phone opened once with /admin?latefeesplit=on (the private test switch).
# "off" = the kill switch: every new fee-kept cancel is a flat $14 again, not even the test link. Games already canceled keep
# the price they were canceled with. Needs a deploy.
LATE_FEE_SPLIT = "on"
# "Money page rework" (organizer Money page: Games and Totals, Hide from list with Settings > Advanced > Hidden games, Edit charge on a
# canceled game, the cancel sheet's "Were you charged?" default, a tidier Feature switches page, a quieter History). "on" here only ALLOWS
# it; who sees it is Settings > Feature switches > "Money page rework" (off at ship = nobody), plus a phone opened once with
# /admin?moneyrework=on (the private test switch). "off" = the kill switch: nobody, not even the test link. Admin only, no money rule,
# amount, seat or credit changes. Needs a deploy.
MONEY_REWORK = "on"
# "Instant taps" (a tapped button changes the screen at once, the save runs in the background, a failed save puts the screen back exactly
# and says what failed; where the server decides, the button shows a pressed state and a small spinner). Player and organizer screens.
# "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Instant taps" (off at ship = nobody), plus a phone opened once
# with ?instanttaps=on (the private test switch, works on /admin too). "off" = the kill switch: nobody, not even the test link. Tap
# feedback only: no money rule, amount, seat or credit depends on it. Needs a deploy.
INSTANT_TAPS = "on"
# "Adjust credit" (the organizer adds or removes credit on one player by hand, with a required reason; gear sheet on the Players page).
# "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Adjust credit" (off at ship = nobody), plus a phone opened once
# with /admin?adjustcredit=on (the private test switch). "off" = the kill switch: nobody, not even the test link, and the save is refused.
# Organizer screens only. Uses the existing credit ledger (no new table). Needs a deploy.
ADJUST_CREDIT = "on"
# "Venmo request" (a blue "Venmo request" link per person who still owes, only where that player has a Venmo username saved).
# "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Venmo request" (off at ship = nobody), plus a phone opened once
# with /admin?venmorequest=on (the private test switch). "off" = the kill switch: nobody, not even the test link. Organizer screens
# only; it only shows links (nothing is sent, charged or saved). Needs a deploy.
VENMO_REQUEST = "on"
# "Home collapse" (player Home: only THIS WEEK and NEXT WEEK show; every later game sits behind one "More sessions" button, collapsed on each load).
# "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Home collapse" (off at ship = nobody), plus a phone opened once with
# /?homecollapse=on (the private test switch). "off" = the kill switch: nobody, not even the test link. Player screens, display only. Needs a deploy.
HOME_COLLAPSE = "on"

# "Tonight glow" (the date tile on player cards and the organizer Home says TONIGHT in a solid green band, with a slow green glow and a gentle light sweep on the
# date badge only, or TOMORROW in a soft green band with no motion; Eastern time; Reduce Motion holds everything still). "on" here only ALLOWS it; who gets it is
# Settings > Feature switches > "Tonight glow" (off at ship = nobody), plus a phone opened once with ?tonightglow=on (the private test switch). "off" = the kill
# switch: nobody, not even the test link. Display only. Needs a deploy.
TONIGHT_GLOW = "on"
# "Color cleanup" (one color system: green in and paid, amber owes, blue links and credit, purple texting only, gray neutral, red cancel and errors; Waitlist and the
# Extra game tag go gray, the Canceled pill turns red, two Cancel sheet lines get shorter). "on" here only ALLOWS it; who gets it is Settings > Feature switches >
# "Color cleanup" (off at ship = nobody), plus a phone opened once with ?colorcleanup=on (works on /admin too). "off" = the kill switch. Display only. Needs a deploy.
COLOR_CLEANUP = "on"
# "Simpler player cards" (no "Court booked / Court not booked" words or dot on player cards; the calendar icon only next to "You're in"; one small "On the waitlist"
# label only for a player who is on a waitlist). "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Simpler player cards" (off at ship =
# nobody), plus a phone opened once with ?playercards=on. "off" = the kill switch. Display only. Needs a deploy.
PLAYER_CARDS_SIMPLE = "on"
# "Last call texts" (Zip 8, shared/lastCall.ts): the night-before Check-in and Need players words follow Alex's rules (still in? anyone else? / need X more
# or the game is canceled to avoid fees). "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Last call texts" (off at ship = nobody),
# plus a phone opened once with /admin?lastcall=on. "off" = the kill switch. Words only. Needs a deploy.
LAST_CALL_TEXTS = "on"
# "Short games" (Zip 9, shared/gameLength.ts): a game that is exactly 1.5 hours (End minus Start) is priced from its own row of the one game-length table
# ($11 each at 4 in, $9 at 5, $7 at 6, $6 at 7, $5 at 8; court $36), with a heads-up on Add game and Edit game, a "1.5 hr game · $11 each" tag on the
# organizer tile and list row, and its real end time on Add to calendar. CHANGES MONEY for 1.5 hour games only. "on" here only ALLOWS it; who gets it is
# Settings > Feature switches > "Short games" (off at ship = nobody), plus a phone opened once with ?shortgames=on. "off" = the kill switch. Needs a deploy.
SHORT_GAMES = "on"
# "Card time and buttons" (Zip 9): player cards show the start time and "2 hours" / "1.5 hours" under the date tile, and a card you are in gets one small
# joined button (Add to calendar | Directions) at the top right of the "You're in" line. "on" here only ALLOWS it; who gets it is Settings > Feature
# switches > "Card time and buttons" (off at ship = nobody), plus a phone opened once with ?cardtime=on. "off" = the kill switch. Display only. Needs a deploy.
CARD_TIME_BUTTONS = "on"

# Preview deployments (any branch that is not main) use the throwaway
# database "pickleball-preview" (fake data only), never the live one, so a
# tester on a preview link can't change real seats, payments or credit.
# No Telegram or clock secrets are set for previews, so they never send alerts.
# Links on a preview point at the preview's own address (no SITE_URL here).
[env.preview]

[env.preview.vars]
GO_LINKS = "on"
TIME_SHIFT = "on"
MOTION = "on"
MOTION_ADMIN = "on"
PAY_ALWAYS = "on"
ADMIN_V2 = "on"
PAY_NOTE = "on"
ADMIN_R2 = "on"
ADMIN_R3 = "on"
LATE_FEES = "on"
PLAYER_FIX1 = "on"
PAY_SHEET = "on"
TEXTS_R2 = "on"
LATE_FEE_SPLIT = "on"
MONEY_REWORK = "on"
INSTANT_TAPS = "on"
ADJUST_CREDIT = "on"
VENMO_REQUEST = "on"
HOME_COLLAPSE = "on"
TONIGHT_GLOW = "on"
COLOR_CLEANUP = "on"
PLAYER_CARDS_SIMPLE = "on"
LAST_CALL_TEXTS = "on"
SHORT_GAMES = "on"
CARD_TIME_BUTTONS = "on"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "pickleball-preview"
database_id = "6f94e087-0596-4286-8945-647923b349a0"
migrations_dir = "migrations"
