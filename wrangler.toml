# Cloudflare Pages project config. `database_id` comes from
# `npx wrangler d1 create pickleball` (see README).
name = "pickleball-club"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "pickleball"
database_id = "5c939453-ebef-4a1d-869e-9a952339d275"
migrations_dir = "migrations"

# Zip 21 "Error alerts" (shared/errorAlerts.ts): the error box, a free Durable Object in the Worker pickleball-error-box
# (worker/box.ts, deploy it first). It holds what the error alerts remember, so they write nothing to the database. Production only:
# previews have no box (and no Telegram), so they never send an error alert. Remove this block (and deploy) = no error alerts at all.
[[durable_objects.bindings]]
name = "ERROR_BOX"
class_name = "ErrorBox"
script_name = "pickleball-error-box"

# ---------- Variables: read this before adding one (Zip 45, Sat Nov 14, 2026) ----------
# "Allowed unless off" flags do not need a variable; add one only if it must differ from the default.
# Cloudflare's free plan allows 64 variables per site, secrets included. Most feature switches read a missing variable exactly like "on"
# (the code is (value ?? 'on').trim().toLowerCase() !== 'off'), so an "on" line for them did nothing and only used up the limit. Zip 45
# removed those lines: production went from 58 variables to 9, preview from 60 to 12. tests/variables-proof.test.ts runs the site's own
# switch code on the old list and on this file and fails if any switch would answer differently.
# These need NO line (missing = allowed; who gets each one is its Settings > Feature switches row). To kill one, add NAME = "off" here
# (and in the preview list further down, for a preview), then deploy:
#   TIME_SHIFT, PAY_ALWAYS, ADMIN_V2, PAY_NOTE, ADMIN_R2, ADMIN_R3, LATE_FEES, PLAYER_FIX1, PAY_SHEET, TEXTS_R2, LATE_FEE_SPLIT, MONEY_REWORK,
#   INSTANT_TAPS, ADJUST_CREDIT, VENMO_REQUEST, HOME_COLLAPSE, TONIGHT_GLOW, COLOR_CLEANUP, PLAYER_CARDS_SIMPLE, LAST_CALL_TEXTS, SHORT_GAMES,
#   CARD_TIME_BUTTONS, CARD_CLEANUP, ALERT_CARDS, SPEED_FEWER_QUERIES, SPEED_DIRECT_LOAD, SPEED_LAST_SCREEN, SPEED_LAST_SCREEN_ADMIN, SEAT_DOTS,
#   PLAYERS_REDO, SWAP_BUTTON, ADMIN_UNDO, GAME_DAY_CARD, SECOND_CHANCE, UNPAID_NUDGE, ERROR_ALERTS, AFTER_GAME_CARD, TOTALS_REFRESH, SPENT_TOTALS,
#   CHEAPER_FIX, ACTING_FOR_OTHERS, CHECKIN_PAY_LINE, PLAYERS_SHEET_REDO, BOOKING_HOURS, EXTENDED_TIME, HOME_SCREEN_TIP, CHRISTMAS_SKIN,
#   GAME_DAY_TEXT, TAP_GUARD_FIX.
#   Also no line, since they shipped: GUEST_SPOT (Zip 42), VENUE_ALERT (Zip 43).
# The lines below are the ones where a missing value reads DIFFERENTLY: SITE_URL (links would use whatever address was opened), GO_LINKS,
# MOTION and MOTION_ADMIN (missing = off), and on previews the preview-only switches (missing = off). What each switch does:
# docs/FEATURE_SWITCHES.md.
[vars]
# The address players use. Shown as the player link in Settings and used in texts and alerts. Missing = whatever address was opened.
SITE_URL = "https://pickleball.juncaj.net"
# "on": night-before Telegram alerts link to the direct text page /go/... (turn "off" to fall back to the admin link).
GO_LINKS = "on"
# "Motion" (animations on the player screens). "on" = everyone (switched on Sun Nov 1, 2026, 8:2x PM Eastern).
# "off" = dark for everyone; a phone opened once with ?motion=on still sees it (the private test switch). Needs a deploy.
MOTION = "on"
# "Motion" on the organizer screens (a separate switch, because MOTION above is already on for the players).
# "on" = the organizer screens animate (switched on Sun Nov 1, 2026, about 10:10 PM Eastern, after Alex tested it on his phone).
# "off" = dark. A phone opened once with ?motionadmin=on still sees it (the private test switch). Needs a deploy.
MOTION_ADMIN = "on"

# Preview deployments (any branch that is not main) use the throwaway
# database "pickleball-preview" (fake data only), never the live one, so a
# tester on a preview link can't change real seats, payments or credit.
# No Telegram or clock secrets are set for previews, so they never send alerts.
# Links on a preview point at the preview's own address (no SITE_URL here).
[env.preview]

[env.preview.vars]
# Same rule as the production list: no line for an "allowed unless off" switch (missing = allowed, the same as "on").
GO_LINKS = "on"
MOTION = "on"
MOTION_ADMIN = "on"
# Preview only (never in [vars] above): lets a phone opened with ?gamedaytest=on see the next game as if it were today.
GAME_DAY_TEST = "on"
# Preview only (never in [vars] above): ?noontest=on pretends it is noon on game day for the Second Chance cards, and the two Telegrams
# are a visible fake (shown on Home, never sent).
SECOND_CHANCE_TEST = "on"
# Preview only (shared/previewCalm.ts): Home and the player page show only the zip's own cards; ?alerts=all shows every alert on that phone.
PREVIEW_CALM = "on"
# Zip 30, PREVIEW ONLY (never in [vars]): the shared preview database loses the Acting for others row whenever another channel re-seeds
# it, so the preview shows the feature regardless. Live only ever follows the Settings row.
ACTING_FOR_OTHERS_PREVIEW = "on"
# Preview only (never in [vars] above): Zip 31's preview shows Extended time even if a re-seed from another branch dropped its Settings row.
EXTENDED_TIME_PREVIEW = "on"
# Zip 37, PREVIEW ONLY (never in [vars]): this preview shows the Home Screen tip and Game day text whatever the shared fake database says (a re-seed from another
# branch drops the rows), and /gt/preview opens the game day text page for the next game. Live only ever follows the Settings rows.
HOME_SCREEN_TIP_PREVIEW = "on"
GAME_DAY_TEXT_PREVIEW = "on"
# Zip 38, PREVIEW ONLY (never in [vars]): this preview acts like the Christmas skin switch is set from the link: ?xmasmode=me (Just me) or ?xmasmode=all (Everyone,
# the default), and ?xmasdate=2026-12-05 pretends today is that day (Everyone only shows from Nov 27 to Dec 31). The live site has no such var, so it ignores both
# and only follows the Settings switch and the real date.
CHRISTMAS_SKIN_PREVIEW = "on"
# GUEST_SPOT (Zip 42) has no line either; the preview's seed turns its Settings row on.

[[env.preview.d1_databases]]
binding = "DB"
database_name = "pickleball-preview"
database_id = "6f94e087-0596-4286-8945-647923b349a0"
migrations_dir = "migrations"
