# "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Game day text" (off at ship = nobody). "off" = the kill switch. Needs a deploy.
GAME_DAY_TEXT = "on"
# Zip 35 "Tap guard fix" (shared/tapGuard.ts): the page's fast-tap guard (Instant taps) drops only a repeat tap on the SAME button, or a tap on another
# button when the one tapped before went away or moved; a quick tap on a neighbouring button (Hide from list, then Hide it) works. Look and feel only: no
# price, money rule, seat or data. "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Tap guard fix" (off at ship = nobody),
# plus a phone opened once with ?tapguard=on. "off" = the kill switch: nobody, not even the test link. Needs a deploy.
TAP_GUARD_FIX = "on"

# Preview deployments (any branch that is not main) use the throwaway
# database "pickleball-preview" (fake data only), never the live one, so a
# tester on a preview link can't change real seats, payments or credit.
# No Telegram or clock secrets are set for previews, so they never send alerts.
# Links on a preview point at the preview's own address (no SITE_URL here).
[env.preview]

[env.preview.vars]
GO_LINKS = "on"
TIME_SHIFT = "on"
MOTION = "on"
MOTION_ADMIN = "on"
PAY_ALWAYS = "on"
ADMIN_V2 = "on"
PAY_NOTE = "on"
ADMIN_R2 = "on"
ADMIN_R3 = "on"
LATE_FEES = "on"
PLAYER_FIX1 = "on"
