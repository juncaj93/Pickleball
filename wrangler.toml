# "off" = the kill switch: nobody, not even the test link. Needs a deploy.
TOTALS_REFRESH = "on"
# Zip 27 "Spent matches Totals" (shared/spentTotals.ts, Audit A item A-05): Players "Spent" counts exactly what Money > Totals counts as
# "Players paid" (late fees kept, cash held on a seat whose price went up), and the organizer's own Spent is the Totals "So far" figure, a
# credit month shown as "$8 credit". Organizer only, display only. "on" here only ALLOWS it; who gets it is Settings > Feature switches >
# "Spent matches Totals" (off at ship = nobody), plus a phone opened once with /admin?spenttotals=on. "off" = the kill switch. Needs a deploy.
SPENT_TOTALS = "on"
# Zip 39 "Made cheaper after paying" (shared/cheaperFix.ts, server/cheaperFix.ts): a late fee kept on a game whose price went DOWN after a
# player paid keeps only the fee and gives the rest back as credit (late cancel with the fee kept, late drop, no-show), and a new Price per
# player reprices open games (Audit A, A-18). MOVES MONEY. "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Made cheaper
# after paying" (off at ship = nobody), plus an organizer phone opened once with /admin?cheaperfix=on. "off" = the kill switch. Needs a deploy.
CHEAPER_FIX = "on"
# Zip 30 "Acting for others" (shared/actingForOthers.ts): each phone keeps a random code and a player's own tap writes it into its History
