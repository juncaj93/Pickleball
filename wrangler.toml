# plus a phone opened once with ?gameday=on (works on /admin too). "off" = the kill switch: nobody, not even the test link. Needs a deploy.
# GAME_DAY_TEST (the "see the next game as today" link, ?gamedaytest=on) is deliberately NOT here: it exists only for previews, below.
GAME_DAY_CARD = "on"

# Zip 15 "Second Chance" (shared/secondChance.ts): same-day games that are not booked. A game canceled the night before with exactly 3 in
# gets a card on admin Home (Book a court, then Reopen game at the same or a new time, then Text the group); a game added on its own day
# gets a Text the group card; Telegram 1 at 4 in (not all paid) and Telegram 2 at 4 paid, once each per game; Venmo Request buttons on
# Home. "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Second Chance" (off at ship = nobody), plus a phone opened
# once with /admin?secondchance=on (cards only; the Telegrams follow the Settings row alone). "off" = the kill switch. Needs a deploy.
# SECOND_CHANCE_TEST (pretend noon on game day, fake Telegrams) is deliberately NOT here: it exists only for previews, below.
SECOND_CHANCE = "on"

# Zip 17 "Unpaid nudge" (shared/unpaidNudge.ts): the owe card says "You owe $28" / "$14 each: Nov 3 and Nov 5"; after I'm in with 1 or 2
# unpaid games an 8 second toast asks them to pay; at 3 or more (UNPAID_LIMIT) the I'm in button is dimmed, a tap opens "You owe $42" with
# Pay, and the SERVER refuses the player's own sign-up until they pay. The organizer is never blocked; the organizer's own add still works.
# "on" here only ALLOWS it; who gets it is Settings > Feature switches > "Unpaid nudge" (off at ship = nobody), plus a phone opened once
# with ?nudge=on. "off" = the kill switch: nobody, not even the test link. Needs a deploy.
UNPAID_NUDGE = "on"
# Zip 21 "Error alerts" (shared/errorAlerts.ts): a short Telegram to Alex when the clock's tick fails, the weekly backup fails or ends
# INCOMPLETE, the database fails (its free daily limit, or repeated errors) or the site answers a burst of server errors, and when the
# clock stopped for 20 minutes or more. At most 1 an hour per kind and 6 a day. "on" here only ALLOWS it; who gets it is Settings >
# Feature switches > "Error alerts" (off at ship = nothing sent). "off" = the kill switch: nothing, not even the test button. Needs a deploy.
ERROR_ALERTS = "on"
# Zip 16 "After-game cards" (shared/afterGame.ts): after the organizer finalizes a game, a player whose final price is below what they paid
# sees one blue card the next time they open the site ("$5 back to your credit", X to close, gone after 7 days); a player who paid a lower
# price earlier and now owes more sees "You owe $2 more" on the owe card that is already there. Display only. "on" here only ALLOWS it;
# who gets it is Settings > Feature switches > "After-game cards" (off at ship = nobody), plus a phone opened once with ?aftergame=on.
# "off" = the kill switch: nobody, not even the test link. Needs a deploy.
AFTER_GAME_CARD = "on"
# Zip 23 "Totals refresh" (shared/totalsRefresh.ts): Money > Totals redone from Alex's mock: a "So far" card and a "Projected" card (Membership,
# Court costs, Owed to venue, Players paid / pay, then the total with the cost per court, like $21/court) and one collapsed "Month by month"
# card. Same numbers as before; money amounts use the site's own number font. Organizer only, display only. "on" here only ALLOWS it; who
