# Cloudflare Pages project config. `database_id` comes from
# `npx wrangler d1 create pickleball` (see README).
name = "pickleball-club"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "pickleball"
database_id = "5c939453-ebef-4a1d-869e-9a952339d275"
migrations_dir = "migrations"

# The address players use. Shown as the player link in Settings and used in texts.
[vars]
SITE_URL = "https://pickleball.juncaj.net"
# "on": night-before Telegram alerts link to the direct text page /go/... (turn "off" to fall back to the admin link).
GO_LINKS = "on"

# Preview deployments (any branch that is not main) use the throwaway
# database "pickleball-preview" (fake data only), never the live one, so a
# tester on a preview link can't change real seats, payments or credit.
# No Telegram or clock secrets are set for previews, so they never send alerts.
# Links on a preview point at the preview's own address (no SITE_URL here).
[env.preview]

[env.preview.vars]
GO_LINKS = "on"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "pickleball-preview"
database_id = "6f94e087-0596-4286-8945-647923b349a0"
migrations_dir = "migrations"
