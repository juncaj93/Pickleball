AFTER_GAME_CARD = "on"
# Preview only (never in [vars] above): ?noontest=on pretends it is noon on game day for the Second Chance cards, and the two Telegrams
# are a visible fake (shown on Home, never sent).
SECOND_CHANCE_TEST = "on"
UNPAID_NUDGE = "on"
TOTALS_REFRESH = "on"
SPENT_TOTALS = "on"
CHEAPER_FIX = "on"
ACTING_FOR_OTHERS = "on"
CHECKIN_PAY_LINE = "on"
PLAYERS_SHEET_REDO = "on"
# Zip 30, PREVIEW ONLY (never in [vars]): the shared preview database loses the Acting for others row whenever another channel re-seeds
# it, so the preview shows the feature regardless. Live only ever follows the Settings row.
ACTING_FOR_OTHERS_PREVIEW = "on"
BOOKING_HOURS = "on"
EXTENDED_TIME = "on"
TAP_GUARD_FIX = "on"
# Preview only (never in [vars] above): Zip 31's preview shows Extended time even if a re-seed from another branch dropped its Settings row.
EXTENDED_TIME_PREVIEW = "on"
HOME_SCREEN_TIP = "on"
# Zip 37, PREVIEW ONLY (never in [vars]): this preview shows the Home Screen tip and Game day text whatever the shared fake database says (a re-seed from another
# branch drops the rows), and /gt/preview opens the game day text page for the next game. Live only ever follows the Settings rows.
HOME_SCREEN_TIP_PREVIEW = "on"
CHRISTMAS_SKIN = "on"
# Zip 38, PREVIEW ONLY (never in [vars]): this preview has the Christmas skin switch on whatever the shared fake database says, and ?xmasdate=2026-12-05 pretends
# today is that day (the live site has no such var, so it ignores the date link). Without the date link the real date decides, like live.
CHRISTMAS_SKIN_PREVIEW = "on"
GAME_DAY_TEXT = "on"
GAME_DAY_TEXT_PREVIEW = "on"
# Preview only (shared/previewCalm.ts): Home and the player page show only the zip's own cards; ?alerts=all shows every alert on that phone.
PREVIEW_CALM = "on"

