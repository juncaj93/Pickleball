EXTENDED_TIME = "on"
# Zip 37 "Home Screen tip" (shared/homeScreenTip.ts): players on an iPhone or iPad in Safari (not already a Home Screen app) get one card at the top of Home from
# their SECOND visit on ("Rather have this as an app?" with a "Show me how" sheet). Look only. "on" here only ALLOWS it; who gets it is Settings > Feature
