# The smart-alert clock (worker/cron.ts), plus the weekly backup copy (worker/backup.ts). Free plan: one cron trigger (the account has 5, all used).
# Deploy: npx wrangler deploy --config worker/wrangler.toml
# Secret (same value as the Pages project's CRON_SECRET):
#   npx wrangler secret put CRON_SECRET --config worker/wrangler.toml
name = "pickleball-alerts-clock"
main = "cron.ts"
compatibility_date = "2025-10-01"
# No public address: it only runs on its schedule.
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://pickleball-club-9h0.pages.dev"
# Zip 21 "Error alerts": on a failure only this Worker sees (the weekly backup, or no answer from the site) it tells the site at
# /api/cron/report; the site decides (its Settings switch ships off). "off" stops those reports. The knock is unaffected either way.
ERROR_REPORTS = "on"

# The weekly backup copy (Zip 8, worker/backup.ts). DB is the LIVE database and is only READ (SELECTs); every write goes
# to BACKUP, the private copy database. Remove these two blocks (and deploy) to stop the copies; the knock is unaffected.
[[d1_databases]]
binding = "DB"
database_name = "pickleball"
database_id = "5c939453-ebef-4a1d-869e-9a952339d275"

[[d1_databases]]
binding = "BACKUP"
database_name = "pickleball-backups"
database_id = "a532f080-7535-4d4d-8067-62ab6af928e4"

# Zip 19: the Worker's private line to itself. The hourly backup look and each step of a weekly copy run as their own runs of this
# Worker, each with its own CPU allowance (one big run took about 13 ms; each step is a few ms). No public address: only this Worker
# can use it, and each call carries CRON_SECRET. Remove this block (and deploy) to go back to doing the copy inside the knock's run.
[[services]]
binding = "SELF"
service = "pickleball-alerts-clock"
